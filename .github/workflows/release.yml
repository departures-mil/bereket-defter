# Bereket Defter — test → derleme (Windows: PyInstaller one-dir + NSIS kurulum + win-app zip; Ubuntu: imzalı APK) → GitHub Release
# (ortak çekirdek reusable-release: latest.json + son 5 sürümden FCD1 yamaları).
# Yayın: sürümü yazın (masaustu/notlar.py + python3 araclar/surum_yaz.py X.Y.Z), main'e birleştirin, sonra
#   gh api -X POST repos/departures-mil/bereket-defter/actions/workflows/release.yml/dispatches -f ref=main   (ya da etiket vX.Y.Z)
# Entegrasyon dallarında (ortak-cekirdek-*) yalnız test + derleme çalışır.
# Android imzası (secret): ANDROID_KEYSTORE_B64, ANDROID_KEYSTORE_PASS, [ANDROID_KEY_PASS], [ANDROID_KEY_ALIAS — yoksa keytool ile bulunur].
# Yeni APK'nın imza sertifikası kurulu APK'larınkiyle (guncelleme/BereketDefter-16.apk) AYNI olmalı; değilse derleme durur.
# Release'ten sonra eski kurulumlar için köprü: python3 araclar/kopru.py && git commit && git push (imza gerekmez).
name: release
on:
  push:
    tags: ['v*']
    branches: ['ortak-cekirdek-*']
  workflow_dispatch:

permissions:
  contents: write

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with: { fetch-depth: 0 }
      - uses: actions/setup-python@v5
        with: { python-version: '3.12' }
      - name: Qt (offscreen) kitaplıkları
        run: sudo apt-get update -q && sudo apt-get install -y -q libegl1 libgl1 libxkbcommon0 libfontconfig1 libdbus-1-3 >/dev/null
      - run: pip install -q "PySide6==6.8.1" pytest
      - name: pytest (veri kuralları, sürüm, köprü, kabuk duman testi)
        run: python -m pytest -q test
      - uses: actions/setup-node@v4
        with: { node-version: 22 }
      - name: Telefon arayüzü (Chromium)
        run: |
          npm i --no-save --silent playwright-core@1.49.1
          CHROME="$(command -v google-chrome || command -v chromium)" node test/mobil.test.js
      - name: Etiket = sürüm
        if: startsWith(github.ref, 'refs/tags/v')
        run: |
          v="$(python -c "import sys; sys.path.insert(0,'masaustu'); import surum; print(surum.APP_VERSION)")"
          [ "v$v" = "${GITHUB_REF_NAME}" ] || { echo "::error::etiket ${GITHUB_REF_NAME} ≠ sürüm v$v"; exit 1; }

  build-win:
    needs: test
    runs-on: windows-latest
    env:
      PYTHONUTF8: '1'
      PYTHONIOENCODING: utf-8
    outputs:
      version: ${{ steps.ver.outputs.version }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: '3.12' }
      - id: ver
        shell: bash
        run: echo "version=$(python -c "import sys; sys.path.insert(0,'masaustu'); import surum; print(surum.APP_VERSION)")" >> "$GITHUB_OUTPUT"
      - run: pip install -q "PySide6==6.8.1" "pyinstaller==6.11.1"
      - name: PyInstaller (one-dir)
        run: pyinstaller paket/BereketDefter.spec --noconfirm --clean --distpath dist --workpath build
      - name: Paketlenmiş program açılıyor mu
        shell: bash
        run: |
          export BEREKET_SMOKE="$RUNNER_TEMP/smoke.txt" AV_DATA_DIR="$RUNNER_TEMP/veri"
          ./dist/BereketDefter/BereketDefter.exe &
          for i in $(seq 1 60); do [ -f "$BEREKET_SMOKE" ] && break; sleep 1; done
          cat "$BEREKET_SMOKE" || { echo "::error::paketlenmiş program açılmadı"; exit 1; }
      - name: win-app (fcpack zip) + NSIS kurulum
        shell: pwsh
        run: |
          $v = "${{ steps.ver.outputs.version }}"
          New-Item -ItemType Directory -Force release | Out-Null
          $env:PYTHONPATH = "masaustu"
          python -m fccore.fcpack dist/BereketDefter release/BereketDefter-win-app.zip
          # Runner görüntüsünde NSIS yoksa kur; kurulum yeri (x86 / x64) ya da PATH değişebilir
          $adaylar = { @("${env:ProgramFiles(x86)}\NSIS\makensis.exe", "$env:ProgramFiles\NSIS\makensis.exe", "$env:ChocolateyInstall\bin\makensis.exe") }
          $nsis = (& $adaylar) | Where-Object { Test-Path $_ } | Select-Object -First 1
          if (-not $nsis) {   # 1) resmi NSIS zip'i (SourceForge), 2) olmazsa Chocolatey — her biri 3 deneme
            foreach ($i in 1..3) {
              try {
                Invoke-WebRequest -UseBasicParsing -MaximumRedirection 10 -UserAgent "Wget" -OutFile "$env:RUNNER_TEMP\nsis.zip" `
                  -Uri "https://downloads.sourceforge.net/project/nsis/NSIS%203/3.10/nsis-3.10.zip"
                Expand-Archive -Force "$env:RUNNER_TEMP\nsis.zip" "$env:RUNNER_TEMP\nsis"
                $nsis = Get-ChildItem "$env:RUNNER_TEMP\nsis" -Recurse -Filter makensis.exe | Select-Object -First 1 -ExpandProperty FullName
                if ($nsis) { break }
              } catch { Write-Host "NSIS zip indirilemedi ($i): $_"; Start-Sleep 10 }
            }
          }
          if (-not $nsis) {
            foreach ($i in 1..3) {
              choco install nsis -y --no-progress
              $nsis = (& $adaylar) | Where-Object { Test-Path $_ } | Select-Object -First 1
              if (-not $nsis) { $nsis = (Get-Command makensis.exe -ErrorAction SilentlyContinue).Source }
              if ($nsis) { break }
              Start-Sleep 20
            }
          }
          if (-not $nsis) { Write-Error "NSIS (makensis.exe) bulunamadı"; exit 1 }
          Write-Host "NSIS: $nsis"
          & $nsis /V2 "/DVERSION=$v" "/DSRC=$pwd\dist\BereketDefter" "/DOUT=$pwd\release\BereketDefter-Setup-$v.exe" paket\kurulum.nsi
          if ($LASTEXITCODE -ne 0) { exit 1 }
          Get-ChildItem release | Format-Table Name, Length
      - uses: actions/upload-artifact@v4
        with:
          name: release-win
          path: release/
          retention-days: 5

  build-android:
    needs: test
    runs-on: ubuntu-latest
    outputs:
      files: ${{ steps.files.outputs.files }}
    env:
      HAS_KEY: ${{ secrets.ANDROID_KEYSTORE_B64 != '' && secrets.ANDROID_KEYSTORE_PASS != '' }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        if: env.HAS_KEY == 'true'
        with: { distribution: temurin, java-version: 17 }
      - name: Android SDK (platform 35, build-tools 35)
        if: env.HAS_KEY == 'true'
        run: |
          SM="$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager"
          [ -f "$ANDROID_HOME/platforms/android-35/android.jar" ] || yes | "$SM" "platforms;android-35" >/dev/null
          [ -d "$ANDROID_HOME/build-tools/35.0.0" ] || yes | "$SM" "build-tools;35.0.0" >/dev/null
      - name: İmzalı APK (apktool ağacı + Java eki → smali)
        id: apk
        if: env.HAS_KEY == 'true'
        env:
          ANDROID_KEYSTORE_B64: ${{ secrets.ANDROID_KEYSTORE_B64 }}
          ANDROID_KEYSTORE_PASS: ${{ secrets.ANDROID_KEYSTORE_PASS }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASS: ${{ secrets.ANDROID_KEY_PASS }}
        run: |
          set -euo pipefail
          export ANDROID_JAR="$ANDROID_HOME/platforms/android-35/android.jar" PATH="$ANDROID_HOME/build-tools/35.0.0:$PATH"
          mkdir -p ~/.cache/og-apk
          curl -sSfL -o ~/.cache/og-apk/apktool.jar https://github.com/iBotPeaches/Apktool/releases/download/v2.12.1/apktool_2.12.1.jar
          bash araclar/java_smali.sh
          KS="$RUNNER_TEMP/bereket.keystore"
          echo "$ANDROID_KEYSTORE_B64" | base64 -d > "$KS"
          if [ -z "${ANDROID_KEY_ALIAS:-}" ]; then
            ANDROID_KEY_ALIAS="$(keytool -list -v -keystore "$KS" -storepass "$ANDROID_KEYSTORE_PASS" 2>/dev/null | sed -n 's/^Alias name: //p' | head -1)"
            echo "alias keystore'dan bulundu"
          fi
          [ -n "$ANDROID_KEY_ALIAS" ] || { echo "::error::keystore'da alias bulunamadı"; exit 1; }
          v="$(python3 -c "import sys; sys.path.insert(0,'masaustu'); import surum; print(surum.APP_VERSION)")"
          mkdir release
          python3 araclar/apk.py "$KS" "$ANDROID_KEYSTORE_PASS" "release/BereketDefter-$v.apk" "$ANDROID_KEY_ALIAS" "${ANDROID_KEY_PASS:-}"
          rm -f "$KS"
          yeni="$(python3 araclar/apk.py --sertifika "release/BereketDefter-$v.apk")"
          eski="$(python3 araclar/apk.py --sertifika guncelleme/BereketDefter-16.apk)"
          echo "sertifika: yeni $yeni · kurulu $eski"
          [ "$yeni" = "$eski" ] || { echo "::error::APK başka anahtarla imzalandı; kurulu telefonlar güncelleyemez"; exit 1; }
          ls -la release && sha256sum release/*
          echo "apk=true" >> "$GITHUB_OUTPUT"
      - name: Anahtar yok → Android atlandı
        if: env.HAS_KEY != 'true'
        run: echo "::warning::ANDROID_KEYSTORE_B64 / ANDROID_KEYSTORE_PASS secret'ları yok — APK derlenmedi, android kanalı bu sürümde yok."
      - uses: actions/upload-artifact@v4
        if: steps.apk.outputs.apk == 'true'
        with:
          name: release-android
          path: release/
          retention-days: 5
      - name: Yayınlanacak kanallar
        id: files
        run: |
          {
            echo 'files<<KANALLAR'
            echo 'win-app=BereketDefter-win-app.zip'
            echo 'win-setup=*Setup*.exe'
            if [ "${{ steps.apk.outputs.apk }}" = "true" ]; then echo 'android=*.apk'; fi
            echo 'KANALLAR'
          } >> "$GITHUB_OUTPUT"

  release:
    needs: [test, build-win, build-android]
    if: startsWith(github.ref, 'refs/tags/v') || (github.event_name == 'workflow_dispatch' && github.ref == 'refs/heads/main')
    permissions:
      contents: write
    uses: departures-mil/ortak-cekirdek/.github/workflows/reusable-release.yml@main
    with:
      app_id: bereket-defter
      version: ${{ needs.build-win.outputs.version }}
      file_prefix: BereketDefter
      release_title: Bereket Defter v${{ needs.build-win.outputs.version }}
      files: ${{ needs.build-android.outputs.files }}
      notes_json: release-notes.json
      min_version: 1.21.2
      core_ref: main
